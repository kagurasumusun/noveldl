name: NovelDLiOS
options:
  minimumXcodeGenVersion: 2.39.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.NovelDLiOS
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  NovelDLiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: NovelDLiOS
      - path: ../../novel_core/src/apple
        group: novel_core
        buildPhase: sources
    resources:
      - path: ../../novel_core/presets
        type: folder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
          - processing
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - com.example.NovelDLiOS.toc-refresh
          - com.example.NovelDLiOS.download-continuation
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.example.NovelDLiOS
            CFBundleURLSchemes:
              - novelios
        SWIFT_OBJC_BRIDGING_HEADER: NovelDLiOS/NovelDLiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../novel_core/include"
          - "$(SRCROOT)/../../novel_core/src/apple"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../novel_core/build"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lnovel_core"
          - "-lsqlite3"
          - "-lzstd"
          - "-lz"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
    dependencies:
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: AppIntents.framework
    scheme:
      testTargets: []

  NovelDLShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: ShareExtension
      - path: ../../novel_core/src/apple
        group: novel_core
        buildPhase: sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NovelDLiOS.ShareExtension
        INFOPLIST_KEY_CFBundleDisplayName: Bookmarks
        SWIFT_OBJC_BRIDGING_HEADER: NovelDLiOS/NovelDLiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../novel_core/include"
          - "$(SRCROOT)/../../novel_core/src/apple"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../novel_core/build"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lnovel_core"
          - "-lsqlite3"
          - "-lzstd"
          - "-lz"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
